version: "3"
services:

  mariadb:
    image: mariadb:latest
    container_name: mariadb
    # restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: mariadb
      MYSQL_USER: dev
      MYSQL_PASSWORD: secret
    ports:
      - 3306:3306
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - backend
  pr-checker:
    build:
      dockerfile: Dockerfile
      context: ./
    ports:
      - 8080:8080
    depends_on:
     - mariadb

    networks:
      - backend


volumes:
  mariadb_data:


networks:
  backend:
    driver: bridge